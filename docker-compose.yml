services:

  app:
    build: .
    container_name: berumen_app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      # App
      - APP_NAME=Entretenimiento Berumen
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:8080
      # Base de datos
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=berumen_db
      - DB_USERNAME=berumen
      - DB_PASSWORD=${DB_PASSWORD}
      # Correo
      - MAIL_MAILER=smtp
      - MAIL_HOST=smtp.gmail.com
      - MAIL_PORT=587
      - MAIL_ENCRYPTION=tls
      - MAIL_USERNAME=ecberumen2015@gmail.com
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM_ADDRESS=ecberumen2015@gmail.com
      - MAIL_FROM_NAME="Entretenimiento Berumen"
      # Timezone
      - APP_TIMEZONE=America/Mazatlan
    volumes:
      # Storage persistente (logs, backups, uploads)
      - app_storage:/var/www/html/storage
      - .:/var/www/html
      - ./.env:/var/www/html/.env
      # Logo e imágenes públicas (copiar manualmente logo_berumen.png aquí)
      - ./public/images:/var/www/html/public/images
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: berumen_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: berumen_db
      MYSQL_USER: berumen
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u${DB_USERNAME} -p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app_storage:
  db_data:

env_file:
  - .env.docker